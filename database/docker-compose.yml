version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: mindweaver-postgres
    restart: always
    environment:
      POSTGRES_USER: mindweaver
      POSTGRES_PASSWORD: mindweaver
      POSTGRES_DB: mindweaver
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
